<!DOCTYPE html>
<html lang="en" class="app-shell">
<head>
<meta charset="utf-8" />

<title>theColosseum — Company settings</title>

<style>
:root{--blue:#678DC6;--field:#f4f4f3;--line:#e6e4df;--ink2:#1c1d1c;--gold:#c9a24a;--green:#2f6d4a}
html,body{height:auto}
html{scrollbar-width:none}html::-webkit-scrollbar{display:none}
body{background:#fff;color:var(--ink2);margin:0}
a{color:var(--ink2);text-decoration:none;font-weight:600}
a:hover{color:var(--blue)}
.app{min-height:100vh;height:auto;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;padding:30px 32px 70px;zoom:0.9}
.app-top{width:100%;position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:30px}
.app-logo{font-weight:800;font-size:26px;letter-spacing:-0.03em;color:var(--ink2);line-height:1;text-decoration:none}
.app-logo:hover{color:var(--ink2);opacity:.72}
.app-logo .the{font-weight:400}
.app-back{position:absolute;left:0;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.app-back:hover{color:var(--blue)}
.app-back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app-user{position:absolute;right:0;top:50%;transform:translateY(-50%)}
.app-user.open{z-index:200}
.app-user-btn{width:26px;height:26px;border-radius:50%;overflow:hidden;border:1px solid var(--line);background:#fff;padding:0;cursor:pointer;display:block;transition:border-color .18s,box-shadow .18s}
.app-user-btn img{width:100%;height:100%;object-fit:cover;display:block}
.app-user-btn:hover{border-color:var(--ink2)}
.app-user.open .app-user-btn{border-color:var(--blue);box-shadow:0 0 0 3px rgba(103,141,198,.16)}
.app-user-menu{position:absolute;top:calc(100% + 10px);right:0;z-index:200;min-width:176px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(31,33,32,.16);padding:6px;display:none}
.app-user.open .app-user-menu{display:block}
.app-user-opt{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2)}
.app-user-opt+.app-user-opt{margin-top:2px}
.app-user-opt:hover{background:var(--field);color:var(--ink2)}
.app-user-opt.on{background:var(--field)}
.app-user-opt svg{width:17px;height:17px;stroke:var(--ink2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app-user-sep{border-top:1px solid var(--line);margin:5px 4px}
.app-user-opt.danger{color:oklch(0.6 0.13 25)}
.app-user-opt.danger svg{stroke:oklch(0.6 0.13 25)}
.app-user-opt.danger:hover{background:oklch(0.6 0.13 25 / 0.08)}

.page{width:100%;max-width:680px}
.st-title{font-family:"P22Mackinac",serif;font-weight:500;font-size:32px;letter-spacing:-0.02em;line-height:1.1;margin:0 0 6px}
.st-sub{font-size:14.5px;color:var(--t-body);margin:0 0 30px}
.st-sec{border:1px solid var(--line);border-radius:18px;padding:26px 28px;background:#fff}
.st-sec+.st-sec{margin-top:20px}.st-div{border:0;border-top:1px solid var(--line);margin:32px 0}
.st-h{font-family:"P22Mackinac",serif;font-weight:500;font-size:20px;letter-spacing:-0.01em;margin:0 0 4px}
.st-p{font-size:13.5px;line-height:1.6;color:var(--t-body);margin:0 0 20px;text-wrap:pretty}
.st-form{display:grid;gap:14px}
.st-fld{display:grid;gap:7px}
.st-lbl{font-size:12.5px;font-weight:700;color:var(--ink2)}
.st-in{width:100%;box-sizing:border-box;font-family:inherit;font-size:14.5px;color:var(--ink2);background:var(--field);border:1px solid var(--field);border-radius:999px;padding:12px 18px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.st-in::placeholder{color:var(--t-faint)}
.st-in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(103,141,198,.16);background:#fff}
.st-in.bad{border-color:oklch(0.6 0.13 25)}
.st-row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.st-hint{font-size:12px;color:var(--t-mute);margin:0}
.st-msg{font-size:12.5px;font-weight:600;margin:0;min-height:18px}
.st-msg.err{color:oklch(0.55 0.14 25)}
.st-msg.ok{color:#2f6d4a}
.st-acts{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;margin-top:4px}
.st-btn{font-family:inherit;font-size:13px;font-weight:600;color:#fff;background:var(--ink2);border:1px solid var(--ink2);border-radius:999px;padding:10px 20px;cursor:pointer;transition:opacity .15s;display:inline-flex;align-items:center;gap:8px}
.st-btn:hover{opacity:.85}
.st-btn[disabled]{opacity:.5;cursor:default}
.st-btn.ghost{color:var(--ink2);background:#fff;border-color:var(--line)}
.st-btn.ghost:hover{opacity:1;border-color:var(--ink2)}
.st-btn.danger{color:oklch(0.55 0.14 25);background:#fff;border-color:var(--line)}
.st-btn.danger:hover{opacity:1;border-color:oklch(0.55 0.14 25)}
.st-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.st-link{font-family:inherit;font-size:13px;font-weight:600;color:var(--ink2);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.st-link:hover{color:var(--blue);text-decoration-color:var(--blue)}
.st-reset{display:none;margin-top:18px;padding:14px 16px;border-radius:14px;background:var(--field);font-size:13px;line-height:1.55;color:var(--t-body)}
.st-reset.on{display:block}
.st-reset b{color:var(--ink2)}
.tm-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.tm-hd .st-p{margin-bottom:0;max-width:44ch}.tm-hd .st-btn{flex:none}
.tm-inv{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:14px;margin:20px 0 0;padding:18px;border-radius:14px;background:#fbfaf8;border:1px solid var(--line)}.tm-inv .st-msg,.tm-inv .st-acts{grid-column:1/-1}.tm-inv .st-msg:empty{display:none}.tm-inv .st-in{background:#fff;border-color:var(--line)}
.tm-cnt{margin:22px 0 10px;font-size:12.5px;font-weight:600;color:var(--t-faint)}.tm-cnt b{color:var(--ink2)}
.tm-list{border:1px solid var(--line);border-radius:14px}.tm-row:first-child{border-radius:13px 13px 0 0}.tm-row:last-child{border-radius:0 0 13px 13px}.tm-row:only-child{border-radius:13px}.tm-row{position:relative}.tm-row.dd-on{z-index:5}
.tm-row{display:grid;grid-template-columns:minmax(0,1fr) 150px auto 34px;align-items:center;gap:12px;padding:12px 14px 12px 16px}.tm-row+.tm-row{border-top:1px solid var(--line)}.tm-row.open{background:#fbfaf8}
.tm-m{display:flex;align-items:center;gap:12px;min-width:0}.tm-m>div{min-width:0}
.tm-av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--field);display:block}.tm-av.ini{display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--t-mute);border:1px dashed #cfcdc7;box-sizing:border-box;background:#fff}
.tm-m b{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden}
.tm-m em{display:block;font-style:normal;font-size:12px;color:var(--t-mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--ink2);background:var(--field);border-radius:999px;padding:2px 8px}.tm-tag.inv{color:#8a5f18;background:rgba(201,138,58,.13)}
.tm-lnk{font:inherit;font-weight:600;color:var(--ink2);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--line)}.tm-lnk:hover{color:var(--blue)}
.tm-dd{position:relative;min-width:0}.tm-dd-btn{width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:8px;font:inherit;font-size:13px;font-weight:600;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 13px 9px 15px;cursor:pointer;transition:border-color .15s,box-shadow .15s}.tm-dd-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tm-dd-btn:hover{border-color:var(--ink2)}.tm-dd-btn svg{width:14px;height:14px;flex:none;stroke:var(--t-mute);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}.tm-dd.open .tm-dd-btn{border-color:var(--blue);box-shadow:0 0 0 3px rgba(103,141,198,.16)}.tm-dd.open .tm-dd-btn svg{transform:rotate(180deg)}
.tm-dd-menu{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:60;min-width:100%;width:max-content;max-width:min(300px,88vw);box-sizing:border-box;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(31,33,32,.16);padding:6px}.tm-dd.open .tm-dd-menu{display:block}
.tm-dd-opt{display:flex;align-items:center;gap:11px;width:100%;box-sizing:border-box;font:inherit;font-size:13.5px;line-height:1.35;color:var(--ink2);text-align:left;background:none;border:0;padding:10px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}.tm-dd-opt:hover{background:var(--field)}.tm-dd-opt.sel{font-weight:700}.tm-dd-opt i{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:none;opacity:0}.tm-dd-opt.sel i{opacity:1}.tm-dd-opt em{font-style:normal;font-weight:600;color:var(--t-faint);font-size:12px;margin-left:auto;padding-left:18px;font-variant-numeric:tabular-nums}
.tm-dd-note{font-size:12px;color:var(--t-mute);padding:10px 12px 6px;border-top:1px solid var(--line);margin-top:4px;white-space:normal}
.tm-inv .tm-dd-btn{padding:12px 15px 12px 18px;font-size:14.5px;font-weight:500}
.tm-fixed{font-size:13px;font-weight:600;color:var(--t-mute);padding-left:14px}
.tm-pb{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink2);background:none;border:0;border-radius:999px;padding:8px 10px;cursor:pointer;white-space:nowrap}.tm-pb:hover{background:var(--field)}.tm-pb span{font-size:11.5px;font-weight:700;color:var(--t-mute);font-variant-numeric:tabular-nums}.tm-pb svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}.tm-row.open .tm-pb svg{transform:rotate(180deg)}
.tm-rm{width:34px;height:34px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--t-faint);transition:color .15s,background .15s}.tm-rm:hover{color:oklch(0.55 0.14 25);background:oklch(0.6 0.13 25 / .08)}.tm-rm svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tm-perms{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:4px 0 6px 46px}
.tm-pm{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 14px;cursor:pointer}.tm-pm.lock{cursor:default}
.tm-pm span{min-width:0}.tm-pm b{display:block;font-size:13px;font-weight:700}.tm-pm em{display:block;font-style:normal;font-size:12px;color:var(--t-mute);margin-top:1px}
.tm-pm input{position:absolute;opacity:0;pointer-events:none}.tm-pm i{flex:none;position:relative;width:34px;height:20px;border-radius:999px;background:#d9d7d1;transition:background .15s}.tm-pm i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18);transition:transform .15s}.tm-pm input:checked+i{background:var(--ink2)}.tm-pm input:checked+i::after{transform:translateX(14px)}.tm-pm input:focus-visible+i{box-shadow:0 0 0 3px rgba(103,141,198,.3)}.tm-pm.lock input:checked+i{background:#8c8c88}
.tm-note{grid-column:1/-1;margin:2px 0 0;font-size:12px;color:var(--t-mute)}
.tm-conf{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 16px;padding:12px 14px;border-radius:12px;background:oklch(0.6 0.13 25 / .06);font-size:13px;line-height:1.5;color:var(--t-body)}.tm-conf b{color:var(--ink2)}.tm-conf>div{display:flex;gap:8px}
@media (max-width:640px){.tm-hd{flex-direction:column}.tm-inv{grid-template-columns:minmax(0,1fr)}.tm-row{grid-template-columns:minmax(0,1fr) 34px;row-gap:10px}.tm-m{grid-column:1}.tm-rm,.tm-row>span:last-of-type{grid-column:2;grid-row:1}.tm-dd,.tm-fixed{grid-column:1}.tm-pb{grid-column:1/-1;justify-self:start;padding-left:0}.tm-perms{grid-template-columns:minmax(0,1fr);padding-left:0}.st-sec{padding:22px 18px}}
</style>

        <div class="st-fld"><label class="st-lbl" for="pwCur">Current password</label><input class="st-in" id="pwCur" type="password" autocomplete="current-password" placeholder="Enter current password" /></div>

          <div class="st-fld"><label class="st-lbl" for="pwNew">New password</label><input class="st-in" id="pwNew" type="password" autocomplete="new-password" placeholder="At least 8 characters" /></div>

      </form>

<script>
(function(){
  var u=document.getElementById('appUser'),ub=u.querySelector('.app-user-btn');
  ub.addEventListener('click',function(e){e.stopPropagation();u.classList.toggle('open');});
  document.addEventListener('click',function(e){if(!u.contains(e.target))u.classList.remove('open');});
  var f=document.getElementById('pwForm'),cur=document.getElementById('pwCur'),nw=document.getElementById('pwNew'),cn=document.getElementById('pwCon'),msg=document.getElementById('pwMsg');
  function say(t,k){msg.textContent=t;msg.className='st-msg'+(k?' '+k:'');}
  [cur,nw,cn].forEach(function(i){i.addEventListener('input',function(){i.classList.remove('bad');say('');});});
  f.addEventListener('submit',function(e){
    e.preventDefault();[cur,nw,cn].forEach(function(i){i.classList.remove('bad');});
    if(!cur.value){cur.classList.add('bad');return say('Enter your current password.','err');}
    if(nw.value.length<8){nw.classList.add('bad');return say('New password must be at least 8 characters.','err');}
    if(nw.value===cur.value){nw.classList.add('bad');return say('New password must be different from the current one.','err');}
    if(nw.value!==cn.value){cn.classList.add('bad');return say('Passwords do not match.','err');}
    f.reset();say('Password updated.','ok');
  });
  var rs=document.getElementById('pwReset');
  document.getElementById('pwForgot').addEventListener('click',function(){rs.classList.add('on');});
  document.getElementById('pwResend').addEventListener('click',function(){this.textContent='Sent';this.disabled=true;});
})();
</script>
